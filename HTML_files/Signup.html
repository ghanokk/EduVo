<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/CSS_files/Signup.css">
    <title>Sign up</title>
</head>
<body>
    <div class="container">
        <h1>Sign up</h1>
        <div class="names">
            <div class="first">
                <label for="first-name">First name</label>
            <input type="text" placeholder="First name" id="first-name">
            </div>
            <div class="last">
                <label for="Last-name">Last name</label>
            <input type="text" placeholder="Last name" id="Last-name">
            </div>
        </div>
        <label for="Username">Username</label>
        <input type="text" placeholder="Username" id="Username">
        <label for="email">Email</label>
        <input type="email" placeholder="Enter your email adress" id="email">
        <label for="password">password</label>
        <input type="password" placeholder="Enter your password" id="password">
        <button>
            Login
        </button>
        <div class="dont-have-acc">
        <span>Already have an account <a href="../HTML_files/Login.html">Login</a></span>

        </div>

    </div>
</body>
</html>
