{% extends "base.html" %}

{% load static %}

{% block content %}


<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historie</title>
    <link rel="stylesheet" href="{% static 'CSS_files/Historie.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>


    <div class="historie-header">
        <a href="{% url 'jobs:Jobs' %}" class="back-button">
            <i class="fas fa-arrow-left"></i>
        </a>

        <img src="{% static 'assets/img//historie-logo.png' %}" alt="Logo" class="logo">

        <h1>Historie</h1>
    </div>

    <section class="all-jobs-section">
    {% for job in jobs %}
    <div class="all-job-card">
        <img src="{% static 'assets/img/job-logo.png' %}" alt="{{ job.title }} logo">
        <div class="job-details">
            <h3>{{ job.posted_by.username }}</h3>
            <p>{{ job.title }}</p>
            <p>{{ job.category }}</p>
            <p>{{ job.work_mode }}</p>
            <p>Posted: {{ job.created_at|date:"M d, Y" }}</p>
        </div>
        <a href="{% url 'jobs:job_detail' job.pk %}"><button class="apply-btn">voir l'offre</button></a>
    </div>
    {% endfor %}
</section>
    </section>

</body>

</html>

{% endblock content %}
