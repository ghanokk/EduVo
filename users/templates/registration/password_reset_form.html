{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'CSS_files/forgotPass.css' %}">
    <title>Eduvo</title>
</head>

<body>
    <div class="container">
        <h1>RESET YOUR PASSWORD</h1>
        <p>enter your email to receive a password <br> reset link </p>

        {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
        <form action="" method="post">
            {% csrf_token %}
            <label for="email">Email</label>
            <div class="email">
                <input type="email" name="email" placeholder="Enter your email address" required>
                <img src="{% static 'assets/img/Email.png'%}" alt="email-icon">
            </div>

            <button type="submit">Send Reset Link</button>
        </form>


        <a href="{% url 'users:Register' %}">Back To Login</a>


        <p>Need help ? Contact support</p>
    </div>
</body>

</html>
