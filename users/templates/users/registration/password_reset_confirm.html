{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <link rel="stylesheet" href="{% static 'CSS_files/password_reset_confirm.css' %}">
</head>
<body>
    <div class="background-wrapper">
        <img src="{% static 'assets/img/background.png' %}" alt="background">
        <div class="overlay"></div>
        <div class="card">
            <h1>Reset Your Password</h1>
            <form method="post">
                {% csrf_token %}
                <input type="password" name="new_password1" placeholder="New password" required>
                <input type="password" name="new_password2" placeholder="Confirm new password" required>
                <button type="submit">Reset Password</button>
            </form>
        </div>
    </div>
</body>
</html>
