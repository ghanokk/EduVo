{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'CSS_files/Login.css' %}">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <form method="post" action="{% url 'users:doLogin' %}">
          {% csrf_token %}
        <h1>Login</h1>
        {% if error_message %}
            <div class="error-message">{{ error_message }}</div>
        {% endif %}
        <label for="email">Email</label>
        <input type="email" placeholder="Enter your email adress" id="email" name="email">
        <label for="password">password</label>
        <input type="password" placeholder="Enter your password" id="password" name="password">

        {% include 'users/msg.html' %}
        <button type="submit">Login</button>
        <div class="forgot-pass">
            <a href="{% url 'users:password_reset' %}">Forgot password?</a>
        </div>
        </form>
        <div class="dont-have-acc">
        <span>don't have an account <a href="{% url 'users:Signup' %}">Sign up</a></span>

        </div>

    </div>
</body>
</html>
